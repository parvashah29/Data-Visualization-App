{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4">Verify Your Email</h2>
                    <p class="text-center mb-4">We've sent a verification code to <strong>{{ email }}</strong></p>
                    
                    <form method="POST" class="verification-form">
                        <div class="verification-inputs mb-4">
                            <input type="text" maxlength="1" class="verification-input" required>
                            <input type="text" maxlength="1" class="verification-input" required>
                            <input type="text" maxlength="1" class="verification-input" required>
                            <input type="text" maxlength="1" class="verification-input" required>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Verify Email</button>
                            <a href="{{ url_for('resend_code', email=email) }}" class="btn btn-link">Resend Code</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
.verification-inputs {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.verification-input {
    width: 50px;
    height: 50px;
    text-align: center;
    font-size: 24px;
    border: 2px solid #ddd;
    border-radius: 8px;
    background: #f8f9fa;
    transition: all 0.3s ease;
}

.verification-input:focus {
    border-color: #2575fc;
    background: #fff;
    outline: none;
    box-shadow: 0 0 0 3px rgba(37, 117, 252, 0.1);
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const inputs = document.querySelectorAll('.verification-input');
    const form = document.querySelector('.verification-form');
    
    // Handle input
    inputs.forEach((input, index) => {
        input.addEventListener('input', function() {
            if (this.value.length === 1) {
                if (index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            }
        });
        
        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && index > 0) {
                inputs[index - 1].focus();
            }
        });
    });
    
    // Handle form submission
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const code = Array.from(inputs).map(input => input.value).join('');
        
        // Create hidden input for the code
        const hiddenInput = document.createElement('input');
        hiddenInput.type = 'hidden';
        hiddenInput.name = 'code';
        hiddenInput.value = code;
        form.appendChild(hiddenInput);
        
        form.submit();
    });
});
</script>
{% endblock %}
